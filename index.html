<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도전 골든벨 - 외부평가 대비 자기주도 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d; --navy2:#1f3160; --gold:#f4b400; --gold2:#ffd65a; --cream:#fffaf0;
  --ink:#1d2433; --muted:#6b7385; --line:#e6e1d4; --ok:#1f9d55; --okbg:#e7f6ec; --bad:#d64545; --badbg:#fdecec;
  --card:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:18px 20px 16px;position:relative;overflow:hidden}
header .wrap{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bell{width:44px;height:44px;flex:none}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px}
header h1 span{color:var(--gold)}
header p{margin:2px 0 0;font-size:13px;color:#b9c3dc}
.home-btn{margin-left:auto;background:transparent;border:1px solid #3d4f7c;color:#dfe6f7;border-radius:999px;padding:7px 14px;font-size:13px;display:none}
.home-btn:hover{background:#26386a}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.hidden{display:none!important}

/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--navy)}
.stat small{color:var(--muted);font-size:12px}
.progress{height:10px;background:#efe9da;border-radius:99px;overflow:hidden;margin:4px 0 22px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9f1c);width:0;transition:width .5s}
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 10px;letter-spacing:.3px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;transition:transform .12s, box-shadow .12s;color:var(--ink)}
.mode:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,33,61,.08)}
.mode .ic{font-size:26px}
.mode h3{margin:8px 0 4px;font-size:17px}
.mode p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.mode.main{grid-column:1/-1;background:var(--navy);color:#fff;border:none;display:flex;align-items:center;gap:16px}
.mode.main p{color:#b9c3dc}
.mode.main .ic{font-size:40px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip em{font-style:normal;color:var(--muted);margin-left:4px;font-size:12px}
.chip.on em{color:#b9c3dc}
.catbars{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.catbar{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.catbar .b{height:8px;background:#efe9da;border-radius:99px;overflow:hidden}
.catbar .b i{display:block;height:100%;background:var(--ok)}
.catbar span:last-child{text-align:right;color:var(--muted)}
.reset{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;margin-top:16px}

/* quiz card */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.topbar .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.topbar .grow{flex:1}
.lives{letter-spacing:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 22px;box-shadow:0 10px 30px rgba(20,33,61,.06)}
.qno{display:inline-block;background:var(--gold);color:var(--navy);font-weight:900;border-radius:8px;padding:3px 10px;font-size:13px}
.qcat{display:inline-block;color:var(--muted);font-size:12px;margin-left:8px}
.qtext{font-size:19px;line-height:1.65;margin:14px 0 6px;font-weight:500;word-break:keep-all}
.qsub{background:#f7f3e8;border-radius:10px;padding:10px 14px;font-size:15px;margin:8px 0}
.need{font-size:13px;color:var(--navy2);font-weight:700;margin-top:6px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ox button{font-size:46px;font-weight:900;padding:16px 0;border-radius:16px;border:2px solid var(--line);background:#fff}
.ox .o{color:#2563eb}.ox .x{color:var(--bad)}
.ox button:hover{border-color:var(--navy)}
.ox button:disabled{opacity:.45;cursor:default}
.ox button.sel{opacity:1;border-color:var(--navy);background:#f3f6ff}
.inrow{display:flex;gap:8px;margin-top:18px}
.inrow input{flex:1;font-size:17px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;font-family:inherit;outline:none;min-width:0}
.inrow input:focus{border-color:var(--navy)}
.btn{border:none;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.fb{margin-top:18px;border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.6}
.fb.ok{background:var(--okbg);border:1px solid #b9e5c8}
.fb.bad{background:var(--badbg);border:1px solid #f4c4c4}
.fb h4{margin:0 0 6px;font-size:17px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
.fb .ans{font-weight:700;color:var(--navy);white-space:pre-line}
.fb .mine{color:var(--muted);font-size:13px;margin-top:6px}
.fb .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.timer{height:6px;background:#efe9da;border-radius:99px;overflow:hidden;margin:-6px 0 14px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.timer.warn i{background:var(--bad)}

/* flashcard */
.flip{perspective:1200px;cursor:pointer;min-height:300px}
.flip-inner{position:relative;width:100%;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(20,33,61,.06)}
.face.back{transform:rotateY(180deg);background:var(--navy);color:#fff;justify-content:center}
.face.back .lbl{color:var(--gold);font-weight:700;font-size:13px}
.face.back .big{font-size:24px;font-weight:900;margin-top:10px;white-space:pre-line;line-height:1.5}
.face .tap{margin-top:auto;font-size:12px;color:var(--muted);text-align:center}
.face.back .tap{color:#8e9bbd;margin-top:20px}
.navrow{display:flex;gap:10px;margin-top:14px;align-items:center}
.navrow .grow{flex:1}
.knowrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* result */
.result{text-align:center;padding:30px 20px}
.result .big{font-size:64px}
.result h2{margin:8px 0;font-size:28px;font-weight:900;color:var(--navy)}
.result p{color:var(--muted);margin:4px 0}
.result .score{font-size:44px;font-weight:900;color:var(--navy);margin:14px 0}
.result .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.wronglist{text-align:left;margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.wronglist div{padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.5}
.wronglist div:last-child{border:none}
.wronglist b{color:var(--navy)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.ringing{animation:ring .9s ease-in-out 3;transform-origin:50% 10%}
.revival{background:linear-gradient(135deg,#fff3cd,#ffe08a);border:2px solid var(--gold)}
.banner{background:var(--navy);color:var(--gold);font-weight:900;text-align:center;border-radius:12px;padding:10px;margin-bottom:12px;font-size:15px}

@media (max-width:560px){
  .modes{grid-template-columns:1fr}
  .qtext{font-size:17px}
  .catbar{grid-template-columns:90px 1fr 48px}
  .inrow{flex-direction:column}
  header h1{font-size:19px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <svg class="bell" id="hdrBell" viewBox="0 0 64 64"><path d="M32 6a4 4 0 0 1 4 4v2.2c9 1.9 15 9.8 15 19.3v10.5l5 6v3H8v-3l5-6V31.5c0-9.5 6-17.4 15-19.3V10a4 4 0 0 1 4-4z" fill="#f4b400"/><circle cx="32" cy="56" r="5" fill="#f4b400"/><path d="M20 30c0-6 4-10 9-11" stroke="#fff3c2" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <div>
      <h1>도전 <span>골든벨</span></h1>
      <p>산학일체형 도제학교 · 외부평가 대비 자기주도 학습</p>
    </div>
    <button class="home-btn" id="homeBtn">처음으로</button>
  </div>
</header>

<main id="app"></main>

<script>
/* ===================== 문제 데이터 =====================
   type: ox | word | list
   a: 화면에 보여줄 정답
   word → acc: 인정하는 답(띄어쓰기 무시)
   list → items: [[같은 항목으로 인정하는 말들], ...], need: 맞혀야 하는 개수
   =================================================== */
const CATS = {
  ship:'출하·검사', plan:'생산계획', safe:'안전관리', mat:'자재·재고', fac:'설비관리'
};
const Q = [
 {n:1,c:'ship',t:'ox',pre:'다음은 출하방법이다. 옳으면 O, 틀리면 X',q:'어느 정도 부적합품이 섞여 있더라도 괜찮은 경우 전수검사를 실시한다.',a:'X',tip:'부적합품이 조금 섞여도 괜찮다면 → 샘플링검사'},
 {n:2,c:'ship',t:'ox',pre:'다음은 출하방법이다. 옳으면 O, 틀리면 X',q:'부적합품이 조금이라도 섞여 들어가는 것이 허용되지 않을 시 전수검사를 실시한다.',a:'O'},
 {n:3,c:'ship',t:'ox',pre:'다음은 출하방법이다. 옳으면 O, 틀리면 X',q:'검사에 비용과 시간이 별로 들지 않고 검사 비용에 비해 얻을 수 있는 효과가 크다고 생각될 때 샘플링검사를 실시한다.',a:'X',tip:'비용·시간이 적게 들고 효과가 크면 → 전수검사'},
 {n:4,c:'ship',t:'ox',pre:'다음은 출하방법이다. 옳으면 O, 틀리면 X',q:'시간을 줄이고 약간의 부적합품이 들어가는 것을 허용하는 편이 경제적일 경우 전수검사를 실시한다.',a:'X',tip:'약간의 부적합품 허용이 경제적이면 → 샘플링검사'},
 {n:5,c:'plan',t:'word',q:'생산을 시작하기에 앞서 판매계획을 토대로 생산하려는 제품의 종류, 수량, 가격 등과 아울러 생산 방법, 장소, 일정 등에 관하여 가장 경제적이고 합리적인 예정을 세우는 것을 무엇이라고 할까요?',a:'생산계획',acc:['생산계획']},
 {n:6,c:'plan',t:'word',q:'생산활동 중 일정계획, 자재소요계획, 능력소요계획 등은 장기, 중기, 단기 계획 중 어떤 것에 해당될까요?',a:'단기계획',acc:['단기']},
 {n:7,c:'plan',t:'word',q:'업무일정이 주가 되어 계획, 변경사항, 문제점, 업무진행 정도 등을 파악하는 일지로 근로자의 근무실적 파악이나 원인 추적의 목적으로 삼는 일지 가운데, 제품의 양이 주가 되어 하루 생산되는 제품의 양을 기록하는 일지를 무엇이라고 하는가?',a:'생산 작업 일지',acc:['생산작업일지']},
 {n:8,c:'safe',t:'word',q:'불안전한 행동 및 불안전한 상태가 원인이 되어 재산상의 손실을 가져오는 것을 무엇이라고 하는가?',a:'사고',acc:['사고']},
 {n:9,c:'safe',t:'word',q:'사고를 통해 인적 피해를 초래하는 경우를 무엇이라고 하는가?',a:'상해',acc:['상해']},
 {n:10,c:'ship',t:'ox',pre:'포장 제품의 취급 주의 사항이다. 옳으면 O, 틀리면 X',q:'정해진 적재 단수 이하로 제품을 쌓아야 한다.',a:'O'},
 {n:11,c:'ship',t:'ox',pre:'옳으면 O, 틀리면 X',q:'부적합품은 반드시 식별이 가능한 지정된 장소에 격리 보관한다.',a:'O'},
 {n:12,c:'ship',t:'word',q:'단위 공정이 끝나고 이루어지는 검사를 무엇이라고 하는가?',a:'공정 검사',acc:['공정검사']},
 {n:13,c:'safe',t:'list',need:1,q:'안전 관리를 위한 통계 분석 방법을 1가지만 적으시오.',a:'파레토 다이어그램, 특성요인 다이어그램, 크로스 다이어그램, 관리차트(관리도)',items:[['파레토'],['특성요인'],['크로스'],['관리차트','관리도']]},
 {n:14,c:'mat',t:'list',need:1,q:'자재관리의 기능을 1가지 적으시오.',a:'계획기능, 구매기능, 보관기능',items:[['계획'],['구매'],['보관']]},
 {n:15,c:'mat',t:'word',q:'상부로부터 예산 지출에 대한 사전 승인을 요청하기 위해 작성하는 문서를 무엇이라고 하는가?',a:'예산요구서',acc:['예산요구서']},
 {n:16,c:'ship',t:'list',need:2,q:'제품검사 중 공정에 의한 검사 방법을 2가지만 쓰시오.',a:'수입검사, 공정검사, 최종검사, 출하검사',items:[['수입'],['공정'],['최종'],['출하']]},
 {n:17,c:'mat',t:'list',need:1,q:'재고를 관리하는 목적 1가지만 적으시오.',a:'① 생산 또는 개발 예산 절감\n② 예산의 효율적 집행\n③ 재고 비용 절감\n④ 생산 지연 및 품절 발생 방지',items:[['재고비용'],['예산절감','예산을절감','개발예산'],['효율'],['생산지연','품절']]},
 {n:18,c:'fac',t:'list',need:1,q:'고장의 요인에서 부품 사용상의 오류 1개만 쓰시오.',a:'동작조건에 맞지 않는 부품 사용, 내환경성 설계불량, 다수 부품의 기능저하',items:[['동작조건'],['내환경성','환경성설계'],['기능저하']]},
 {n:19,c:'safe',t:'word',q:'사업장 산업재해를 예방하고 쾌적한 작업 환경을 조성하여 근로자의 생명과 신체 안전을 도모하고 질병을 방지하며, 건강을 유지·증진시키기 위한 근로자 보호 제도를 무엇이라고 하는가?',a:'산업안전보건법',acc:['산업안전보건법','산안법']},
 {n:20,c:'safe',t:'list',need:2,q:'작업 환경 개선의 대책 중 공학적 대책 방법 두 가지를 쓰시오.',a:'대체, 격리, 밀폐, 차단, 환기',items:[['대체'],['격리'],['밀폐'],['차단'],['환기']]},
 {n:21,c:'mat',t:'word',q:'일정 기간 동안 보유하고 있는 재고량들의 평균을 무엇이라고 하는가?',a:'평균재고량',acc:['평균재고']},
 {n:22,c:'plan',t:'word',q:'생산활동 중 생산전략, 제품설계, 공정설계, 입지 및 시설배치 등은 장기, 중기, 단기 계획 중 어떤 것에 해당될까요?',a:'장기계획',acc:['장기']},
 {n:23,c:'ship',t:'word',q:'하나의 측정 장치와 동일한 측정 시료로부터 얻어지는 측정값과 실제 값의 평균 차이를 무엇이라고 할까요?',a:'정확도',acc:['정확도']},
 {n:24,c:'ship',t:'list',need:2,q:'포장의 기능 두 가지를 쓰시오.',a:'내용물 보호, 취급 편리성, 판매 촉진성, 정보성, 친화성, 경제성',items:[['보호'],['취급','편리'],['판매','촉진'],['정보'],['친화'],['경제']]},

/* ===================== 저장 ===================== */
const KEY='goldenbell_v1';
let S={st:{},best:0,bells:0};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function rec(n,ok){
  const s=S.st[n]||{c:0,w:0,last:null};
  if(ok){s.c++;s.last=1}else{s.w++;s.last=0}
  S.st[n]=s;save();
}
const mastered=q=>{const s=S.st[q.n];return s&&s.last===1};
const isWrong=q=>{const s=S.st[q.n];return s&&s.last===0};

/* ===================== 채점 ===================== */
const norm=s=>String(s).toLowerCase().replace(/[^0-9a-z가-힣]/g,'');
function grade(q,input){
  if(q.t==='ox') return input===q.a;
  let s=norm(input);
  if(!s) return false;
  if(q.t==='word') return q.acc.some(a=>s.includes(norm(a)));
  let hit=0;
  for(const al of q.items){
    for(const a of al){const k=norm(a); const i=s.indexOf(k); if(i>=0){hit++; s=s.slice(0,i)+'|'+s.slice(i+k.length); break;}}
  }
  return hit>=q.need;
}

  <div class="progress"><i style="width:${m/Q.length*100}%"></i></div>

  <div class="modes">
    <button class="mode main" data-m="bell60"><div class="ic">🔔</div><div><h3>실전 도전! 골든벨 60</h3><p>시작하면 문제가 섞여서 무작위로 나와요 · 60문제를 맞히면 골든벨 울림! 틀리면 패자부활 문제, 그것도 틀리면 종료.${S.bells?` <br>🏆 지금까지 골든벨 ${S.bells}회 울림`:''}</p></div></button>
    <button class="mode" data-m="card"><div class="ic">📖</div><h3>개념 카드</h3><p>카드를 눌러 뒤집어 보며 정답을 외워요. 처음 공부할 때 추천!</p></button>
    <button class="mode" data-m="practice"><div class="ic">✍️</div><h3>연습 모드</h3><p>시간 제한 없이 직접 답을 써 보고 바로 채점해요. 틀린 문제는 끝에 한 번 더!</p></button>
    <button class="mode" data-m="ox"><div class="ic">⭕</div><h3>O·X 스피드</h3><p>O·X 문제만 빠르게 풀어요.</p></button>
    <button class="mode" data-m="wrong"><div class="ic">📒</div><h3>오답노트 (${w})</h3><p>최근에 틀린 문제만 모아서 다시 풀어요.</p></button>
  </div>

  <br><button class="reset" id="resetBtn">내 기록 모두 지우기</button>
  <div id="resetConfirm" class="hidden" style="margin-top:8px;font-size:13px">정말 지울까요? <button class="btn small ghost" id="rcYes">네, 지워요</button> <button class="btn small ghost" id="rcNo">아니요</button></div>
  `;
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
  $('#resetBtn').onclick=()=>$('#resetConfirm').classList.remove('hidden');
  $('#rcNo').onclick=()=>$('#resetConfirm').classList.add('hidden');
  $('#rcYes').onclick=()=>{S={st:{},best:0,bells:0};save();home()};
}

function start(m){
  if(m==='card') return cards(pool());
  if(m==='practice') return quiz({list:shuffle(pool()),mode:'practice'});
  if(m==='ox') return quiz({list:shuffle(Q.filter(q=>q.t==='ox').concat(REVIVAL)),mode:'practice',title:'O·X 스피드'});
  if(m==='wrong'){const l=Q.filter(isWrong); if(!l.length){toastEmpty();return} return quiz({list:shuffle(l),mode:'practice',title:'오답노트'})}
  if(m==='bell') return quiz({list:shuffle(pool()),mode:'bell'});
  if(m==='bell60') return bell60Intro();
}

/* ===================== 실전 도전: 골든벨 60 ===================== */
const GOAL=60, BT=30, MAXREV=2;
function bell60Intro(){
  stopTimer();showHome(false);
  app.innerHTML=`<div class="card result">
    <div class="big">🔔</div>
    <h2>실전 도전! 골든벨 60</h2>
    <div style="text-align:left;max-width:460px;margin:18px auto 0;line-height:1.9;font-size:15px">
      ① <b>시작</b>을 누르면 전체 ${Q.length}문제가 섞이고, 그중 <b>${GOAL}문제</b>가 무작위로 출제돼요.<br>
      ② 문제당 <b>${BT}초</b>! 시간이 지나면 오답 처리돼요.<br>
      ③ 틀리면 <b>패자부활 문제</b>가 나와요. 맞히면 다음 문제로 계속! (패자부활은 <b>최대 ${MAXREV}번</b>)<br>
      ④ 패자부활 문제까지 틀리거나, 패자부활을 ${MAXREV}번 다 쓴 뒤 또 틀리면 <b>도전 종료</b>.<br>
      ⑤ ${GOAL}문제를 맞히면 <b>골든벨이 울려요!</b> 🎉
    </div>
    <p style="margin-top:16px">🏅 내 최고 기록: ${S.best60||0} / ${GOAL}</p>
    <div class="acts"><button class="btn gold" id="go60" style="font-size:20px;padding:16px 44px">시작!</button></div>
  </div>`;
  $('#go60').onclick=bell60Run;
}

function bell60Run(){
  showHome(false);
  const deck=shuffle(Q);
  const L=deck.slice(0,GOAL);
  // 패자부활 문제: PDF 패자부활 문제 + 이번 판에 출제되지 않은 문제 (겹치지 않게)
  let revPool=shuffle(REVIVAL.concat(deck.slice(GOAL)));
  let i=0, rev=null, revUsed=0, wrong=[];

  function ladder(){
    const pct=i/GOAL*100;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div class="progress" style="flex:1;margin:0;height:14px"><i style="width:${pct}%"></i></div>
      <b style="color:var(--navy);font-size:15px;white-space:nowrap">🔔 ${i} / ${GOAL}</b></div>`;
  }

  function draw(){
    stopTimer();
    const q=rev||L[i];
    const isRev=!!rev;
    app.innerHTML=`
    ${isRev?'<div class="banner">🔥 패자부활전 — 이 문제를 맞히면 다시 살아나요! 틀리면 도전 종료</div>':''}
    ${ladder()}
    <div class="topbar"><span class="pill">🔔 실전 도전</span><span class="pill lives">${'❤️'.repeat(MAXREV-revUsed)}${'🤍'.repeat(revUsed)} 부활 ${MAXREV-revUsed}회 남음</span><span class="grow"></span><span class="pill">${isRev?'패자부활 문제':`${i+1}번째 문제`}</span></div>
    <div class="timer" id="tm"><i></i></div>
    <div class="card ${isRev?'revival':''}">
      <span class="qno">${isRev?'패자부활':'문제 '+q.n}</span><span class="qcat">${CATS[q.c]}</span>
      ${q.pre&&!isRev?`<div class="hint" style="margin-top:12px">${esc(q.pre)}</div>`:''}
      ${isRev&&q.t==='ox'?`<div class="hint" style="margin-top:12px">옳으면 O, 틀리면 X</div>`:''}
      <div class="qtext">${esc(q.q)}</div>
      ${q.sub?`<div class="qsub">${esc(q.sub)}</div>`:''}
      ${q.t==='list'?`<div class="need">✏️ ${q.need}가지를 쉼표(,)로 구분해서 쓰세요</div>`:''}
      ${q.t==='ox'
        ?`<div class="ox"><button class="o" data-v="O">O</button><button class="x" data-v="X">X</button></div>`
        :`<div class="inrow"><input id="ans" autocomplete="off" placeholder="정답을 입력하세요"><button class="btn gold" id="sub">제출</button></div>
          <div class="hint">띄어쓰기는 상관없어요. Enter 키로 제출할 수 있어요.</div>`}
      <div id="fb"></div>
    </div>`;
    let done=false;
    const submit=v=>{if(done)return;done=true;stopTimer();
      const ok=grade(q,v); if(typeof q.n==='number')rec(q.n,ok); feedback(q,v,ok,isRev)};
    if(q.t==='ox'){
      app.querySelectorAll('.ox button').forEach(b=>b.onclick=()=>{b.classList.add('sel');app.querySelectorAll('.ox button').forEach(x=>x.disabled=true);submit(b.dataset.v)});
    }else{
      const inp=$('#ans');inp.focus();
      $('#sub').onclick=()=>{if(!inp.value.trim()){inp.focus();return}inp.disabled=true;$('#sub').disabled=true;submit(inp.value)};
      inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('#sub').click()};
    }
    const t0=Date.now(), bar=$('#tm');
    timerId=setInterval(()=>{
      const left=BT-(Date.now()-t0)/1000;
      bar.firstElementChild.style.width=Math.max(0,left/BT*100)+'%';
      if(left<8)bar.classList.add('warn');
      if(left<=0){const inp=$('#ans');if(inp){inp.disabled=true;$('#sub').disabled=true;submit(inp.value||'')}else{app.querySelectorAll('.ox button').forEach(x=>x.disabled=true);submit('')}}
    },100);
  }

  function feedback(q,v,ok,isRev){
    const mine=q.t==='ox'?(v||'(시간 초과)'):(String(v).trim()||'(시간 초과 / 미입력)');
    let label;
    if(ok) label=(!isRev&&i+1>=GOAL)?'🔔 골든벨 울리기!':(isRev?'부활! 다음 문제 ▶':'다음 문제 ▶');
    else label=(isRev||revUsed>=MAXREV||!revPool.length)?'결과 보기':'🔥 패자부활 문제 도전 ▶';
    $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">
      <h4>${ok?(isRev?'⭕ 부활 성공!':'⭕ 정답!'):(isRev?'❌ 패자부활 실패':'❌ 아쉬워요')}</h4>
      <div>정답: <span class="ans">${esc(q.a)}</span></div>
      ${q.t==='list'?`<div class="hint">※ 위 보기 중 ${q.need}가지만 쓰면 정답이에요.</div>`:''}
      ${q.tip?`<div style="margin-top:6px">💡 ${esc(q.tip)}</div>`:''}
      ${!ok?`<div class="mine">내 답: ${esc(mine)}</div>`:''}
      <div class="acts">
        ${!ok&&q.t!=='ox'&&String(v).trim()?`<button class="btn small ghost" id="override">🙋 제 답도 맞아요 (정답 인정)</button>`:''}
        <button class="btn small" id="go">${label}</button>
      </div></div>`;
    $('#go').focus();
    $('#go').onclick=()=>next(q,ok,isRev);
    const ov=$('#override');
    if(ov) ov.onclick=()=>{if(typeof q.n==='number'){const s=S.st[q.n];s.w=Math.max(0,s.w-1);s.c++;s.last=1;save()}feedback(q,v,true,isRev)};
  }

  function next(q,ok,isRev){
    if(isRev){
      rev=null;
      if(!ok) return end(false);
      i++;                      // 부활 성공 → 틀린 문제는 넘기고 계속
    }else if(ok){
      i++;
      if(i%10===0&&i<GOAL) ringBell();
    }else{
      wrong.push(q);
      if(revUsed>=MAXREV||!revPool.length) return end(false);
      rev=revPool.pop(); revUsed++;
      return draw();
    }
    if(i>=GOAL) return end(true);
    draw();
  }

  function end(win){
    stopTimer();
    S.best60=Math.max(S.best60||0,i); if(i>S.best)S.best=i;
    if(win){S.bells=(S.bells||0)+1;ringBell();confetti()}
    save();
    app.innerHTML=`<div class="card result">
      <div class="big">${win?'🔔':'💪'}</div>
      <h2>${win?'골든벨을 울렸습니다!':'도전 종료! 다음엔 더 멀리'}</h2>
      <div class="score">${i} <small style="font-size:18px;color:var(--muted)">/ ${GOAL}</small></div>
      <p>패자부활 ${revUsed} / ${MAXREV}회 사용 · 내 최고 기록 ${S.best60} / ${GOAL}</p>
      ${wrong.length?`<div class="wronglist">${wrong.map(q=>`<div><b>문제 ${q.n}</b> ${esc(q.q.length>60?q.q.slice(0,60)+'…':q.q)}<br>👉 정답: <b>${esc(q.a.replace(/\n/g,' '))}</b></div>`).join('')}</div>`:''}
      <div class="acts"><button class="btn gold" id="again">다시 도전 (새로 섞기)</button><button class="btn ghost" id="hm">처음으로</button></div>
    </div>`;
    $('#again').onclick=bell60Run;
    $('#hm').onclick=home;
  }
  draw();
}
function toastEmpty(){
  showHome(false);
  app.innerHTML=`<div class="card result"><div class="big">🎉</div><h2>오답노트가 비어 있어요</h2><p>틀린 문제가 생기면 여기에 모여요. 연습 모드나 골든벨에 도전해 보세요!</p><div class="acts"><button class="btn" onclick="home()">처음으로</button></div></div>`;
}

/* ===================== 개념 카드 ===================== */
function cards(list){
  showHome(false);
  let i=0, L=list.slice();
  function draw(){
    const q=L[i];
    app.innerHTML=`
    <div class="topbar"><span class="pill">📖 개념 카드</span><span class="grow"></span><span class="pill">${i+1} / ${L.length}</span></div>
    <div class="flip" id="flip"><div class="flip-inner">
      <div class="face"><div><span class="qno">문제 ${q.n}</span><span class="qcat">${CATS[q.c]}</span></div>
        ${q.pre?`<div class="hint" style="margin-top:12px">${esc(q.pre)}</div>`:''}
        <div class="qtext">${esc(q.q)}</div>${q.sub?`<div class="qsub">${esc(q.sub)}</div>`:''}
        <div class="tap">👆 카드를 누르면 정답이 보여요</div></div>
      <div class="face back"><div class="lbl">정답</div><div class="big">${esc(q.a)}</div>${q.tip?`<div style="margin-top:10px;color:#cfd7ec;font-size:14px">💡 ${esc(q.tip)}</div>`:''}<div class="tap">다시 누르면 문제로</div></div>
    </div></div>
    <div class="knowrow"><button class="btn ghost" id="dk">🤔 아직 헷갈려요</button><button class="btn gold" id="ik">😎 알아요</button></div>
    <div class="navrow"><button class="btn ghost small" id="pv">◀ 이전</button><span class="grow"></span><button class="btn ghost small" id="sh">🔀 섞기</button><button class="btn ghost small" id="nx">다음 ▶</button></div>`;
    const f=$('#flip');
    const fitH=()=>{const fs=f.querySelectorAll('.face');let h=300;fs.forEach(x=>{x.style.position='relative';h=Math.max(h,x.offsetHeight);x.style.position=''});f.style.height=h+'px';f.querySelector('.flip-inner').style.height=h+'px'};
    fitH();
    f.onclick=()=>f.classList.toggle('on');
    $('#pv').onclick=()=>{i=(i-1+L.length)%L.length;draw()};
    $('#nx').onclick=()=>{i=(i+1)%L.length;draw()};
    $('#sh').onclick=()=>{L=shuffle(L);i=0;draw()};
    $('#ik').onclick=()=>{i=(i+1)%L.length;draw()};
    $('#dk').onclick=()=>{rec(q.n,false);i=(i+1)%L.length;draw()};
  }
  draw();
}

/* ===================== 퀴즈 (연습/실전) ===================== */
function quiz(o){
  showHome(false);
  const bell=o.mode==='bell';
  let L=o.list, i=0, score=0, wrong=[], revivalUsed=false, retry=false, inRevival=null;
  const TL=30;

  function draw(){
    stopTimer();
    if(i>=L.length) return finish(true);
    const q=inRevival||L[i];
    const rv=!!inRevival;
    app.innerHTML=`
    ${rv?'<div class="banner">🔥 패자부활전 — 이 문제를 맞히면 다시 살아나요!</div>':''}
    <div class="topbar"><span class="pill">${bell?'🔔 골든벨':'✍️ '+(o.title||(retry?'틀린 문제 다시':'연습 모드'))}</span>
      ${bell?`<span class="pill lives">${revivalUsed?'🤍':'❤️'} 부활 ${revivalUsed?0:1}</span>`:''}
      <span class="grow"></span><span class="pill">${bell?`생존 ${score}문제`:`맞힘 ${score}`}</span><span class="pill">${i+1} / ${L.length}</span></div>
    ${bell?`<div class="timer" id="tm"><i></i></div>`:''}
    <div class="card ${rv?'revival':''}">
      <span class="qno">문제 ${q.n}</span><span class="qcat">${CATS[q.c]}</span>
      ${q.pre?`<div class="hint" style="margin-top:12px">${esc(q.pre)}</div>`:''}
      <div class="qtext">${esc(q.q)}</div>
      ${q.sub?`<div class="qsub">${esc(q.sub)}</div>`:''}
      ${q.t==='list'?`<div class="need">✏️ ${q.need}가지를 쉼표(,)로 구분해서 쓰세요</div>`:''}
      ${q.t==='ox'
        ?`<div class="ox"><button class="o" data-v="O">O</button><button class="x" data-v="X">X</button></div>`
        :`<div class="inrow"><input id="ans" autocomplete="off" placeholder="정답을 입력하세요"><button class="btn gold" id="sub">제출</button></div>
          <div class="hint">띄어쓰기는 상관없어요. Enter 키로 제출할 수 있어요.</div>`}
      <div id="fb"></div>
    </div>`;
    let done=false;
    const submit=v=>{if(done)return;done=true;stopTimer();check(q,v,rv)};
    if(q.t==='ox'){
      app.querySelectorAll('.ox button').forEach(b=>b.onclick=()=>{b.classList.add('sel');app.querySelectorAll('.ox button').forEach(x=>x.disabled=true);submit(b.dataset.v)});
    }else{
      const inp=$('#ans');inp.focus();
      $('#sub').onclick=()=>{if(!inp.value.trim()){inp.focus();return}inp.disabled=true;$('#sub').disabled=true;submit(inp.value)};
      inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)$('#sub').click()};
    }
    if(bell){
      const t0=Date.now(), bar=$('#tm');
      timerId=setInterval(()=>{
        const left=TL-(Date.now()-t0)/1000;
        bar.firstElementChild.style.width=Math.max(0,left/TL*100)+'%';
        if(left<8)bar.classList.add('warn');
        if(left<=0){const inp=$('#ans');if(inp){inp.disabled=true;$('#sub').disabled=true;submit(inp.value||'')}else{app.querySelectorAll('.ox button').forEach(x=>x.disabled=true);submit('')}}
      },100);
    }
  }

  function check(q,v,rv){
    const ok=grade(q,v);
    if(typeof q.n==='number') rec(q.n,ok);
    showFb(q,v,ok,rv);
  }

  function showFb(q,v,ok,rv){
    const fb=$('#fb');
    const mine=q.t==='ox'?(v||'(시간 초과)'):(String(v).trim()||'(시간 초과 / 미입력)');
    fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}">
      <h4>${ok?'⭕ 정답!':'❌ 아쉬워요'}</h4>
      <div>정답: <span class="ans">${esc(q.a)}</span></div>
      ${q.t==='list'?`<div class="hint">※ 위 보기 중 ${q.need}가지만 쓰면 정답이에요.</div>`:''}
      ${q.tip?`<div style="margin-top:6px">💡 ${esc(q.tip)}</div>`:''}
      ${!ok?`<div class="mine">내 답: ${esc(mine)}</div>`:''}
      <div class="acts">
        ${!ok&&q.t!=='ox'&&String(v).trim()?`<button class="btn small ghost" id="override">🙋 제 답도 맞아요 (정답 인정)</button>`:''}
        <button class="btn small" id="go">${nextLabel(ok,rv)}</button>
      </div></div>`;
    const go=$('#go'); go.focus();
    go.onclick=()=>next(q,ok,rv);
    const ov=$('#override');
    if(ov) ov.onclick=()=>{if(typeof q.n==='number'){const s=S.st[q.n];s.w=Math.max(0,s.w-1);s.c++;s.last=1;save()}showFb(q,v,true,rv)};
  }
  function nextLabel(ok,rv){
    if(!bell) return '다음 문제 ▶';
    if(rv) return ok?'부활! 계속 도전 ▶':'결과 보기';
    if(ok) return '다음 문제 ▶';
    return revivalUsed?'결과 보기':'패자부활전 도전 ▶';
  }

  function next(q,ok,rv){
    if(!bell){
      if(ok)score++; else if(!wrong.includes(q))wrong.push(q);
      i++;
      if(i>=L.length){ return finish(true) }
      return draw();
    }
    if(rv){
      inRevival=null;
      if(ok){i++;return draw()}
      return finish(false);
    }
    if(ok){score++;i++; if(score>0&&score%10===0)ringBell(); return draw()}
    wrong.push(q);
    if(!revivalUsed){revivalUsed=true;inRevival=REVIVAL[Math.floor(Math.random()*REVIVAL.length)];return draw()}
    return finish(false);
  }

  function finish(cleared){
    stopTimer();
    if(bell){
      if(score>S.best)S.best=score;
      if(cleared){S.bells=(S.bells||0)+1}
      save();
      if(cleared){ringBell();confetti()}
      app.innerHTML=`<div class="card result">
        <div class="big">${cleared?'🔔':'💪'}</div>
        <h2>${cleared?'골든벨을 울렸습니다!':'여기까지! 다음엔 더 멀리'}</h2>
        <div class="score">${score} <small style="font-size:18px;color:var(--muted)">/ ${L.length} 문제 생존</small></div>
        <p>내 최고 기록: ${S.best}문제</p>
        ${wrong.length?`<div class="wronglist">${wrong.map(q=>`<div><b>문제 ${q.n}</b> ${esc(q.q.length>60?q.q.slice(0,60)+'…':q.q)}<br>👉 정답: <b>${esc(q.a.replace(/\n/g,' '))}</b></div>`).join('')}</div>`:''}
        <div class="acts"><button class="btn gold" id="again">다시 도전</button><button class="btn ghost" id="wr">오답노트 풀기</button><button class="btn ghost" id="hm">처음으로</button></div>
      </div>`;
      $('#again').onclick=()=>start('bell');
    }else{
      const total=L.length, perfect=wrong.length===0;
      if(perfect)confetti();
      app.innerHTML=`<div class="card result">
        <div class="big">${perfect?'🏆':'📝'}</div>
        <h2>${perfect?'모두 맞혔어요!':'한 바퀴 완료!'}</h2>
        <div class="score">${score} <small style="font-size:18px;color:var(--muted)">/ ${total}</small></div>
        ${wrong.length?`<p>틀린 문제 ${wrong.length}개는 오답노트에 저장됐어요.</p><div class="wronglist">${wrong.map(q=>`<div><b>문제 ${q.n}</b> ${esc(q.q.length>60?q.q.slice(0,60)+'…':q.q)}<br>👉 정답: <b>${esc(q.a.replace(/\n/g,' '))}</b></div>`).join('')}</div>`:''}
        <div class="acts">${wrong.length?`<button class="btn gold" id="rt">틀린 ${wrong.length}문제 바로 다시 풀기</button>`:''}<button class="btn ghost" id="wr">오답노트</button><button class="btn ghost" id="hm">처음으로</button></div>
      </div>`;
      const rt=$('#rt'); if(rt) rt.onclick=()=>{L=shuffle(wrong);wrong=[];i=0;score=0;retry=true;draw()};
    }
    $('#wr').onclick=()=>start('wrong');
    $('#hm').onclick=home;
  }
  draw();
}

home();
</script>
</body>
</html>
